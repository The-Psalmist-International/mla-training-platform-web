query MyEnrollmentsPage($limit: Int! = 20, $offset: Int! = 0, $search: String) {
  myEnrollmentsPage(limit: $limit, offset: $offset, search: $search) {
    totalCount
    items {
      id
      userId
      courseId
      enrolledBy
      createdAt
      completedAt
      learningProgress {
        completedRequiredItems
        totalRequiredItems
        percentage
      }
      course {
        ...CourseListFields
      }
    }
  }
}

query MyEnrollments($limit: Int! = 20, $offset: Int! = 0) {
  myEnrollments(limit: $limit, offset: $offset) {
    id
    userId
    courseId
    enrolledBy
    createdAt
    completedAt
    learningProgress {
      completedRequiredItems
      totalRequiredItems
      percentage
    }
    course {
      ...CourseListFields
    }
  }
}

query CourseEnrollments($courseId: ID!, $limit: Int! = 20, $offset: Int! = 0) {
  courseEnrollments(courseId: $courseId, limit: $limit, offset: $offset) {
    id
    userId
    learnerName
    learnerAvatarUrl
    createdAt
    completedAt
  }
}
