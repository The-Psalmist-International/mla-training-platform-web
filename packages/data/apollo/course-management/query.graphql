query CourseManagement($id: ID!) {
  course(id: $id) {
    id
    ownerId
    title
    description
    thumbnailUrl
    status
    certificateEnabled
    isPrivate
    publishedAt
    createdAt
    updatedAt
    modules {
      id
      title
      position
      items {
        id
        title
        type
        position
        required
        isPrivate
        body
        fileLesson {
          fileAssetId
          fileAsset { id filename format sizeBytes status }
        }
        videoLesson {
          videoAssetId
          completionThreshold
          videoAsset {
            id
            thumbnailUrl
            status
            durationSeconds
          }
        }
        assessment {
          passMark
          attemptLimit
          timeLimitSeconds
          questions {
            id
            type
            prompt
            points
            position
            explanation
            referenceAnswer
            options {
              id
              label
              position
              isCorrect
            }
          }
        }
        videoPrompt {
          instructions
          maxDurationSeconds
          requiresReview
        }
      }
    }
  }
}
mutation SetCoursePrivacy($id: ID!, $isPrivate: Boolean!) {
  setCoursePrivacy(id: $id, isPrivate: $isPrivate) {
    id
  }
}
mutation SetLessonPrivacy(
  $courseId: ID!
  $moduleId: ID!
  $itemId: ID!
  $isPrivate: Boolean!
) {
  setLessonPrivacy(
    courseId: $courseId
    moduleId: $moduleId
    itemId: $itemId
    isPrivate: $isPrivate
  ) {
    id
  }
}
