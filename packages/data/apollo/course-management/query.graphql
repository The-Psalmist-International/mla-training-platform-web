query CourseLearners(
  $courseId: ID!
  $limit: Int!
  $offset: Int!
  $search: String
) {
  courseEnrollmentsPage(
    courseId: $courseId
    limit: $limit
    offset: $offset
    search: $search
  ) {
    totalCount
    items {
      id
      userId
      learnerName
      learnerEmail
      learnerAvatarUrl
      createdAt
      completedAt
    }
  }
}
query CourseLearnerDetails($id: ID!) {
  enrollment(id: $id) {
    id
    courseId
    userId
    createdAt
    completedAt
    progress {
      itemId
      status
      watchedPercentage
      completedAt
    }
  }
  certificateForEnrollment(enrollmentId: $id) {
    id
    certificateNumber
    recipientName
    issuedAt
    status
    verificationUrl
    revokedReason
  }
}
query CourseAssessmentReviews(
  $courseId: ID!
  $limit: Int!
  $offset: Int!
  $search: String
) {
  assessmentReviewQueuePage(
    courseId: $courseId
    limit: $limit
    offset: $offset
    search: $search
  ) {
    totalCount
    items {
      id
      assessmentTitle
      learnerName
      learnerAvatarUrl
      attemptNumber
      submittedAt
      status
    }
  }
}
query CourseVideoReviews(
  $courseId: ID!
  $limit: Int!
  $offset: Int!
  $search: String
) {
  videoSubmissionReviewQueuePage(
    courseId: $courseId
    limit: $limit
    offset: $offset
    search: $search
  ) {
    totalCount
    items {
      id
      promptTitle
      learnerName
      learnerAvatarUrl
      attemptNumber
      createdAt
      status
      asset {
        id
        title
        status
      }
    }
  }
}
query CourseAttemptReview($id: ID!) {
  assessmentAttempt(id: $id) {
    id
    assessmentTitle
    status
    maxScore
    score
    passed
    answers {
      question {
        id
        type
        prompt
        points
        options {
          id
          label
        }
      }
      selectedOptionId
      textAnswer
      awardedPoints
      feedback
      explanation
      referenceAnswer
    }
  }
}
mutation GradeCourseAttempt($input: GradeAssessmentAttemptInput!) {
  gradeAssessmentAttempt(input: $input) {
    id
    status
    score
    passed
  }
}
query CourseSubmissionReview($id: ID!) {
  videoSubmission(id: $id) {
    id
    promptTitle
    instructions
    status
    feedback
    maxDurationSeconds
  }
  videoSubmissionPlayback(id: $id) {
    url
    expires
  }
}
mutation ReviewCourseSubmission($input: ReviewVideoSubmissionInput!) {
  reviewVideoSubmission(input: $input) {
    id
    status
    feedback
  }
}
mutation RevokeCourseCertificate($input: RevokeCertificateInput!) {
  revokeCertificate(input: $input) {
    id
    status
