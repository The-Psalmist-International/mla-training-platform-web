fragment VideoAssetListFields on VideoAsset {
  id
  title
  thumbnailUrl
  mimeType
  status
  durationSeconds
  sizeBytes
  createdAt
  updatedAt
}

query MyVideoAssetsPage(
  $limit: Int! = 20
  $offset: Int! = 0
  $status: VideoAssetStatus
  $search: String
) {
  myVideoAssetsPage(
    limit: $limit
    offset: $offset
    status: $status
    search: $search
  ) {
    totalCount
    items {
      ...VideoAssetListFields
    }
  }
}

query VideoAssetDetails($id: ID!) {
  videoAsset(id: $id) {
    ...VideoAssetListFields
  }
}
query PreviewLessonVideo($id: ID!) {
  previewLessonVideo(id: $id) {
    url
    expires
  }
}
mutation CreateLessonVideoUpload($input: LessonVideoUploadInput!) {
  createLessonVideoUpload(input: $input) {
    asset {
      ...VideoAssetListFields
    }
    upload {
      endpoint
      videoId
      libraryId
      signature
      expires
    }
  }
}
mutation RefreshLessonVideoUpload($id: ID!) {
  refreshLessonVideoUpload(id: $id) {
    asset {
      ...VideoAssetListFields
    }
    upload {
      endpoint
      videoId
      libraryId
      signature
      expires
    }
  }
}
mutation SyncLessonVideoAsset($id: ID!) {
  syncLessonVideoAsset(id: $id) {
    ...VideoAssetListFields
  }
}

mutation SetLessonVideoThumbnail($id: ID!, $thumbnailUrl: String) {
  setLessonVideoThumbnail(id: $id, thumbnailUrl: $thumbnailUrl) {
    ...VideoAssetListFields
  }
}

query MyVideoAssets($limit: Int! = 20, $offset: Int! = 0) {
  myVideoAssets(limit: $limit, offset: $offset) {
    ...VideoAssetListFields
  }
}
