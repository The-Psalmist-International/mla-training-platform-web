fragment CourseListFields on Course {
  id
  ownerId
  title
  description
  thumbnailUrl
  status
  certificateEnabled
  publishedAt
  createdAt
  updatedAt
}

query CoursesPage(
  $limit: Int! = 20
  $offset: Int! = 0
  $status: CourseStatus
  $mine: Boolean
  $search: String
) {
  coursesPage(
    limit: $limit
    offset: $offset
    status: $status
    mine: $mine
    search: $search
  ) {
    totalCount
    items {
      ...CourseListFields
    }
  }
}

query CourseDetails($id: ID!) {
  course(id: $id) {
    id
    ownerId
    title
    description
    thumbnailUrl
    status
    certificateEnabled
    publishedAt
    createdAt
    updatedAt
    modules {
      id
      title
      position
      items {
        id
        title
        type
        position
        required
      }
    }
  }
}
mutation CreateCourse($input: CreateCourseInput!) {
  createCourse(input: $input) {
    ...CourseListFields
  }
}
mutation UpdateCourse($id: ID!, $input: UpdateCourseInput!) {
  updateCourse(id: $id, input: $input) {
    id
    ownerId
    title
    description
    thumbnailUrl
    status
    certificateEnabled
    publishedAt
    createdAt
    updatedAt
  }
}
mutation PublishCourse($id: ID!) {
  publishCourse(id: $id) {
    id
    title
    status
  }
}
mutation UnpublishCourse($id: ID!) {
  unpublishCourse(id: $id) {
    id
    title
    status
  }
}
mutation ArchiveCourse($id: ID!) {
  archiveCourse(id: $id) {
    id
    title
    status
  }
}
mutation CreateCourseModule($courseId: ID!, $input: CourseModuleInput!) {
  createCourseModule(courseId: $courseId, input: $input) {
    id
    modules {
      id
      title
      position
    }
  }
}

query Courses(
  $limit: Int! = 20
  $offset: Int! = 0
  $status: CourseStatus
  $mine: Boolean
  $search: String
) {
  courses(
    limit: $limit
    offset: $offset
    status: $status
    mine: $mine
    search: $search
  ) {
    ...CourseListFields
  }
}
