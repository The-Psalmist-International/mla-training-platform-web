name: web-ci

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Build-time public URLs; apps must compile without real backends.
      VITE_GRAPHQL_URL: http://localhost:4000/graphql
      VITE_WORKSPACE_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run codegen:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
