name: web-codegen
on:
  workflow_call:

permissions:
  contents: read

jobs:
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_GRAPHQL_URL: http://localhost:4000/graphql
      VITE_WORKSPACE_URL: http://localhost:5000
      VITE_LEARNER_URL: http://localhost:5001
    steps:
      - uses: actions/checkout@v4
        with:
          path: martyrs-platform-web
      - uses: actions/checkout@v4
        with:
          repository: The-Psalmist-International/mla-training-platform-core
          ref: ${{ vars.CORE_SCHEMA_REF || ((github.base_ref || github.ref_name) == 'main' && 'main' || 'develop') }}
          token: ${{ secrets.CORE_REPO_READ_TOKEN }}
          path: mla-platform-core
          sparse-checkout: schema.graphql
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: martyrs-platform-web/package-lock.json
      - run: npm ci
        working-directory: martyrs-platform-web
      - run: npm run codegen:check
        working-directory: martyrs-platform-web
