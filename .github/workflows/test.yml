name: web-test
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_GRAPHQL_URL: http://localhost:4000/graphql
      VITE_WORKSPACE_URL: http://localhost:5000
      VITE_LEARNER_URL: http://localhost:5001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
